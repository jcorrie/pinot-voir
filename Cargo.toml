bench = false


[[bin]]
name = "supabase"
path = "src/bin/supabase.rs"
test = false
doctest = false
bench = false


[[bin]]
name = "uart_log"
path = "src/bin/uart_log.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "audio_usb"
path = "src/bin/audio_usb.rs"
test = false
doctest = false
bench = false



[[bin]]
name = "audio_udp"
path = "src/bin/audio_udp.rs"
test = false
doctest = false
bench = false


[[bin]]
name = "i2s_wifi"
path = "src/bin/i2s_wifi.rs"
